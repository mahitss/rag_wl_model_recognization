name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type (patch|minor|major)"
        required: true
        default: "patch"
      create_release:
        description: "Create GitHub release"
        required: true
        default: "true"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync backend dependencies
        run: uv sync --project services/api --extra dev

      - name: Verify quality gates before release
        run: |
          echo "Verifying all quality gates..."
          uv run --project services/api --extra dev ruff check services/api
          uv run --project services/api --extra dev ruff format --check services/api
          uv run --project services/api --extra dev pytest -q
          echo "All quality gates passed."

      - name: Generate build identifier
        id: build_id
        run: |
          BUILD_ID="$(python scripts/release.sh build-id)"
          echo "build_id=${BUILD_ID}" >> $GITHUB_OUTPUT
          echo "Build ID: ${BUILD_ID}"

      - name: Bump version (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          BUMP="${{ github.event.inputs.version_bump }}"
          bash scripts/release.sh version-bump "${BUMP}"

      - name: Generate release notes
        run: |
          bash scripts/release.sh release-notes "${{ github.ref }}" || true

      - name: Verify artifacts
        id: verify
        run: |
          # Placeholder for artifact verification; in production this would
          # verify signed build artifacts before release.
          echo "Artifact verification skipped (no artifacts to verify in this pipeline)."

      - name: Create GitHub release
        if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: "Release ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release notes as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: CHANGELOG.md
          retention-days: 30

  rollback:
    name: Document rollback procedure
    runs-on: ubuntu-latest
    needs: release
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print rollback instructions
        run: |
          echo ""
          echo "============================================================"
          echo "  ROLLBACK PROCEDURE"
          echo "============================================================"
          echo ""
          echo "  If this release needs to be rolled back:"
          echo ""
          echo "  1. Code rollback:"
          echo "     git revert <commit-sha>   # or redeploy previous image"
          echo "     git push origin main"
          echo ""
          echo "  2. Database rollback:"
          echo "     Restore SQLite from the most recent backup:"
          echo "     uv run --project services/api python -m app.backup restore"
          echo ""
          echo "  3. Verify:"
          echo "     curl -f https://your-instance/api/v1/ready"
          echo ""
          echo "  See docs/deployment.md section 8 for full rollback details."
          echo "============================================================"
          echo ""
