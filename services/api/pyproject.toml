[project]
name = "wonderlearn-api"
version = "0.1.0"
description = "Local-first WonderLearn API foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.143.3",
    "pydantic-settings==2.16.0",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["services/api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
