[pytest]
testpaths = services/api/tests tests
addopts = -ra
pythonpath = services/api
markers =
    integration: opt-in tests requiring a locally cached pretrained model
    performance: performance regression tests with loose timing bounds
    security: security regression tests
    quality_gates: quality gate regression tests using the M18 synthetic dataset
    e2e: end-to-end user acceptance tests spanning full API journeys
