[project]
name = "wonderlearn-api"
version = "0.1.0"
description = "Local-first WonderLearn API foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "argon2-cffi==23.1.0",
    "fastapi==0.143.3",
    "itsdangerous==2.2.0",
    "Pillow==11.3.0",
    "pydantic-settings==2.16.0",
    "pypdf==6.21.1",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.1",
]
semantic = [
    "fastembed==0.9.0",
]
ocr = [
    "pytesseract==0.3.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["services/api"]
markers = ["integration: opt-in tests requiring a locally cached pretrained model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
