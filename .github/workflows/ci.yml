name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend tests, format, contract & dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync backend dependencies (dev + ocr extras)
        run: uv sync --project services/api --extra dev --extra ocr

      - name: Validate Python formatting
        run: uv run --project services/api --extra dev ruff format --check services/api

      - name: Run Ruff
        run: uv run --project services/api --extra dev ruff check services/api

      - name: Validate API contract against frontend routes
        working-directory: services/api
        run: uv run --extra dev python app/contract_validation.py

      - name: Run backend test suite
        run: uv run --project services/api --extra dev pytest

      - name: Run database migration tests
        run: uv run --project services/api --extra dev pytest tests/test_migrations.py -v

      - name: Run secret detection tests
        run: uv run --project services/api --extra dev pytest tests/test_secret_detection.py -v

      - name: Run Python dependency audit
        run: |
          uv export --project services/api --format requirements-txt --no-hashes > /tmp/wonderlearn-backend-requirements.txt
          python -m pip install --quiet pip-audit
          python -m pip_audit -r /tmp/wonderlearn-backend-requirements.txt --desc

  frontend:
    name: Frontend tests, typecheck, accessibility & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Run frontend tests
        run: npm test --prefix apps/web

      - name: Run TypeScript typecheck
        run: npm run typecheck --prefix apps/web

      - name: Run frontend dependency audit
        run: npm audit --prefix apps/web --audit-level=high --omit=dev

      - name: Production frontend build
        run: npm run build --prefix apps/web

  evaluation:
    name: Evaluation & regression suite
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync backend dependencies (dev + semantic)
        run: uv sync --project services/api --extra dev --extra semantic

      - name: Run offline evaluation suite
        run: uv run --locked --project services/api --extra dev --extra semantic python evaluations/run_suite.py

  security:
    name: Security gates: SAST, secret detection, dependency audit
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync backend dependencies (dev)
        run: uv sync --project services/api --extra dev

      - name: Run SAST with bandit
        run: |
          uv run --project services/api --extra dev pip install bandit[toml]
          uv run --project services/api --extra dev bandit -r services/api/app -f json -o /tmp/bandit-results.json || true
          uv run --project services/api --extra dev python - <<'EOF'
          import json, sys
          with open("/tmp/bandit-results.json") as f:
            results = json.load(f)
          high = [r for r in results.get("results", []) if r.get("issue_severity") == "HIGH"]
          if high:
            print(f"CRITICAL: {len(high)} HIGH severity SAST finding(s)")
            for r in high:
              print(f"  {r['filename']}:{r['line_number']} - {r['issue_text']}")
            sys.exit(1)
          print("No HIGH severity SAST findings.")
          EOF

      - name: Run secret detection with trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.base_ref }}
          head: ${{ github.head_ref }}
          only-verified: false
          fail: true
        continue-on-error: true

      - name: Run secret detection tests (fallback)
        run: uv run --project services/api --extra dev pytest tests/test_secret_detection.py -v

      - name: Fail on critical security failures
        run: |
          uv run --project services/api --extra dev python - <<'EOF'
          import json, sys
          sys.path.insert(0, "services/api")
          from tests.test_security_redteam import _report
          report = _report.to_dict()
          print(json.dumps(report, indent=2))
          if report["critical_failure_count"] > 0:
            print(f"CRITICAL: {report['critical_failure_count']} critical security test(s) failed.")
            sys.exit(1)
          if report["total_failed"] > 0:
            print(f"FAILURE: {report['total_failed']} security test(s) failed.")
            sys.exit(1)
          print("All AI security red-team tests passed.")
          EOF

  pipeline:
    name: Pipeline integrity & release readiness
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync backend dependencies (dev)
        run: uv sync --project services/api --extra dev

      - name: Run pipeline tests
        run: uv run --project services/api --extra dev python scripts/pipeline_test.py

      - name: Verify build artifact integrity
        run: |
          BUILD_ID="$(python scripts/release.sh build-id)"
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV
          echo "Build ID: ${BUILD_ID}"
